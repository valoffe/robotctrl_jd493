[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "valoffe-robotctrl_jd493"
version = "0.1.0"
description = "用一组明示的正则规则扫描输入，报告机器人运动控制工程师·张量并行切分策略相关的命中行与片段"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "valoffe" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://valoffe.github.io"
Repository = "https://github.com/valoffe/robotctrl_jd493"
Issues = "https://github.com/valoffe/robotctrl_jd493/issues"

[project.scripts]
robotctrl_jd493 = "robotctrl_jd493:main"

[tool.setuptools]
py-modules = ["robotctrl_jd493"]
